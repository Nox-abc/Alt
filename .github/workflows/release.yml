name: Release

# Builds installers for every OS / CPU and, for v* tags, publishes a GitHub Release.
#   macOS    dmg + zip           x64, arm64          (ad-hoc signed, not notarized)
#   Windows  nsis + zip          x64, ia32, arm64    (unsigned)
#   Linux    AppImage, deb, rpm, tar.gz   x64, armv7l (x64 runner) + arm64 (native arm runner)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac --x64 --arm64
          - name: Windows
            os: windows-latest
            args: --win --x64 --ia32 --arm64
          - name: Linux x64 + armv7l
            os: ubuntu-latest
            args: --linux --x64 --armv7l
          - name: Linux arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
    env:
      # no signing certificates in CI (macOS still gets an ad-hoc signature, see electron-builder.yml)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools

      - run: npm ci

      - name: Build renderer + main process
        run: npm run build

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # one installer per architecture (a multi-arch NSIS installer would bundle all three apps)
            for arch in x64 ia32 arm64; do
              npx electron-builder --win "--$arch" --publish never
            done
          else
            npx electron-builder ${{ matrix.args }} --publish never
          fi
          ls -la release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: alt-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  release:
    name: GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
