<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Alt</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B31"/>
      <stop offset="0.55" stop-color="#151518"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E4E6EB"/>
      <stop offset="1" stop-color="#A9AEB9"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- mark: a geometric A whose crossbar is a pen-tool bezier handle -->
  <g filter="url(#markShadow)">
    <path d="M512 250 L748 770 L647 770 L512 472 L377 770 L276 770 Z" fill="url(#silver)"/>
    <rect x="236" y="604" width="552" height="12" rx="6" fill="url(#handle)"/>
    <rect x="208" y="584" width="52" height="52" rx="8" fill="#141417" stroke="#F4F5F7" stroke-width="11"/>
    <rect x="764" y="584" width="52" height="52" rx="8" fill="#141417" stroke="#F4F5F7" stroke-width="11"/>
    <circle cx="512" cy="610" r="31" fill="#FFFFFF"/>
  </g>
</svg>
